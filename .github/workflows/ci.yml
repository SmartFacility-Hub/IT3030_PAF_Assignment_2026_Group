name: Smart Campus CI Pipeline

# Trigger: run on every push to main or dev branch
# Also run on every Pull Request targeting main
on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ main]

jobs:

  # ─── Backend ────────────────────────────────────────────────────────────────
  backend:
    name: Backend — Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Install Java 21
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-

      - name: Build and run tests
        working-directory: ./backend
        env:
          # Use test profile — loads application-test.properties
          SPRING_PROFILES_ACTIVE: test
          APP_JWT_SECRET: test-secret-key-for-ci-must-be-long-enough-256bits-padding
          CLOUDINARY_CLOUD_NAME: test
          CLOUDINARY_API_KEY: test
          CLOUDINARY_API_SECRET: test
          GOOGLE_CLIENT_ID: test
          GOOGLE_CLIENT_SECRET: test
        run: ./mvnw clean verify -Dspring.profiles.active=test -e 2>&1

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: backend/target/surefire-reports/
