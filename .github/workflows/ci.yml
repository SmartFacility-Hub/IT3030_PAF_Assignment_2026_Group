name: Smart Campus CI Pipeline

# Trigger: run on every push to main or dev branch
# Also run on every Pull Request targeting main
on:
  push:
    branches: [ sample ]
  pull_request:
    branches: [ main]

jobs:

  # ─── JOB 1: Build and Test Spring Boot Backend ──────────────────────────────
  backend:
    name: Backend — Build & Test
    runs-on: ubuntu-latest   # GitHub provides a free Ubuntu machine

    # Provide a test PostgreSQL database for integration tests
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: smart_campus_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        # Wait until PostgreSQL is actually ready before running tests
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      # 1. Download your code onto the GitHub machine
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Install Java 17
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # 3. Cache Maven dependencies
      # This makes subsequent runs much faster (skip re-downloading jars)
      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      # 4. Build the project and run all tests
      - name: Build and run tests
        working-directory: ./backend   # adjust if your pom.xml is in root
        env:
          # These override your application.properties during CI
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/smart_campus_test
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: postgres
          SPRING_JPA_HIBERNATE_DDL_AUTO: create-drop
          APP_JWT_SECRET: test-secret-key-for-ci-must-be-long-enough-256bits
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
        run: ./mvnw clean verify

      # 5. Upload test results so you can see them in GitHub UI
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()   # upload even if tests fail
        with:
          name: backend-test-results
          path: backend/target/surefire-reports/

  # ─── JOB 2: Build React Frontend ────────────────────────────────────────────
  frontend:
    name: Frontend — Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci   # ci = clean install, faster and stricter than npm install

      - name: Build React app
        working-directory: ./frontend
        env:
          REACT_APP_API_URL: http://localhost:8081
          CI: false   # prevents warnings from being treated as errors
        run: npm run build

      # 6. Upload the built files as artifact
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/build/

  # ─── JOB 3: Docker Build (runs only if both jobs above pass) ─────────────────
  docker:
    name: Docker — Build Images
    runs-on: ubuntu-latest
    needs: [backend, frontend]   # only runs if backend AND frontend pass

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend Docker image
        run: |
          docker build -t smart-campus-backend:${{ github.sha }} ./backend
          echo "Backend image built successfully"

      - name: Build frontend Docker image
        run: |
          docker build -t smart-campus-frontend:${{ github.sha }} ./frontend
          echo "Frontend image built successfully"
