services:
  backend:
    build:
      context: ./backend
    container_name: smart-campus-backend
    env_file:
      - ./backend/.env
    ports:
      - "8081:8081"

  frontend:
    build:
      context: ./frontend
    container_name: smart-campus-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
