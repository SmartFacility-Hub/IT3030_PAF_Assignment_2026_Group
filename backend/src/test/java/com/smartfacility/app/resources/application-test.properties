# CI Test profile — uses H2 instead of real PostgreSQL
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

# Fake OAuth — prevents context crash in tests
spring.security.oauth2.client.registration.google.client-id=test-client-id
spring.security.oauth2.client.registration.google.client-secret=test-client-secret
spring.security.oauth2.client.registration.google.scope=openid,profile,email

# Fake JWT and Cloudinary for test context
app.jwt.secret=test-secret-key-for-ci-must-be-long-enough-256bits-padding
app.jwt.expiration-ms=86400000
cloudinary.cloud-name=test
cloudinary.api-key=test
cloudinary.api-secret=test
app.frontend.url=http://localhost:3000

management.endpoints.web.exposure.include=health
